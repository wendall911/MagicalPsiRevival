modLoader="javafml"
loaderVersion="${neoforge_loader_version_range}"
license="${license}"
issueTrackerURL="${issue_tracker}"
[[mods]]
    modId="${mod_id}"
    version="${version}"
    displayName="${display_name}"
    updateJSONURL="https://raw.githubusercontent.com/wendall911/MagicalPsiRevival/${mod_update_branch}/files/updates.json"
    displayURL="${display_url}"
    logoFile="${mod_id}_icon.png"
    credits="${mod_credits}"
    authors="${mod_author}"
    description='''
    "${mod_description}"
    '''
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neoforge_loader_version_range}"
    ordering="NONE"
    side="CLIENT"
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${neoforge_mc_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="psi"
    type="required"
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"
